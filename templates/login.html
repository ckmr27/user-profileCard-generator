<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - User Profile Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen overflow-hidden bg-slate-50 text-slate-900">
    <div class="mx-auto flex h-screen max-w-4xl items-center justify-center px-4 py-10">
      <div class="w-full rounded-3xl bg-white p-8 shadow-xl shadow-slate-200/80">
        <h1 class="text-3xl font-semibold text-slate-900">Secure Login</h1>
        <p class="mt-3 text-slate-600">This login route is rate limited and validates credentials from environment variables.</p>

        {% if success %}
        <div class="mt-6 rounded-2xl bg-emerald-50 p-4 text-emerald-800">
          Login successful. No session is maintained in this demo.
        </div>
        {% endif %}

        {% if error %}
        <div class="mt-6 rounded-2xl bg-red-50 p-4 text-red-800">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" class="mt-8 grid gap-6">
          <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-700">Username</span>
            <input
              type="text"
              name="username"
              placeholder="admin"
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200"
              required
            />
          </label>

          <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-700">Password</span>
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200"
              required
            />
          </label>

          <button
            type="submit"
            class="inline-flex w-full items-center justify-center rounded-2xl bg-sky-600 px-6 py-3 text-base font-semibold text-white transition hover:bg-sky-700"
          >
            Sign in
          </button>
        </form>

        <div class="mt-6 text-sm text-slate-500">
          <a href="/" class="font-medium text-sky-600 hover:text-sky-700">Back to profile generator</a>
        </div>
      </div>
    </div>
  </body>
</html>
